{% extends "base.html" %}

{% block title %}
Add Expense | Expense Logger
{% endblock %}

{% block content %}

<div class="form-page">

    <!-- Page Header -->
    <div class="form-page-header">

        <div>
            <p class="form-eyebrow">
                <i class="bi bi-plus-circle-fill"></i>
                New Transaction
            </p>

            <h1>
                Add Expense
            </h1>

            <p>
                Record a new expense and keep your spending organised.
            </p>
        </div>

        <a
            href="{{ url_for('main.index') }}"
            class="btn btn-back"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Expenses
        </a>

    </div>


    <!-- Expense Form Card -->
    <div class="expense-form-card">

        <form
            method="POST"
            action="{{ url_for('main.create_expense') }}"
        >

            <div class="row g-4">

                <!-- Expense Title -->
                <div class="col-md-8">

                    <label
                        for="title"
                        class="form-label-custom"
                    >
                        Expense Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control form-control-custom"
                        placeholder="e.g. Grocery shopping"
                        required
                    >

                </div>


                <!-- Amount -->
                <div class="col-md-4">

                    <label
                        for="amount"
                        class="form-label-custom"
                    >
                        Amount
                    </label>

                    <div class="input-group-custom">

                        <span class="currency-symbol">
                            £
                        </span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            class="form-control form-control-custom"
                            placeholder="0.00"
                            step="0.01"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <!-- Category -->
                <div class="col-md-6">

                    <label
                        for="category"
                        class="form-label-custom"
                    >
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        class="form-select form-control-custom"
                        required
                    >

                        <option value="" selected disabled>
                            Select a category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Bills">
                            Bills & Utilities
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date -->
                <div class="col-md-6">

                    <label
                        for="date"
                        class="form-label-custom"
                    >
                        Date
                    </label>

                   <input
                             type="date"
                             id="date"
                             name="date"
                             class="form-control"
                             min="2000-01-01"
                             required
                            >
                                       

                </div>


                <!-- Note -->
                <div class="col-12">

                    <label
                        for="note"
                        class="form-label-custom"
                    >
                        Note
                        <span class="optional-label">
                            Optional
                        </span>
                    </label>

                    <textarea
                        id="note"
                        name="note"
                        class="form-control form-control-custom"
                        rows="5"
                        placeholder="Add any additional details about this expense..."
                    ></textarea>

                </div>

            </div>


            <!-- Form Actions -->
            <div class="form-actions">

                <a
                    href="{{ url_for('main.index') }}"
                    class="btn btn-cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-save-expense"
                >
                    <i class="bi bi-check-lg"></i>
                    Save Expense
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
